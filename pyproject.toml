[project]
name = "chitti-gemini"
version = "0.1.0"
description = "AI personal assistant powered by Google Gemini"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=1.68.0",
    "rich>=14.0.0",
    "prompt-toolkit>=3.0.50",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
]

[project.scripts]
chitti = "chitti:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
